name: vendor-katex
# 오프라인 대시보드에 넣을 수식 렌더러(KaTeX)를 data 브랜치 vendor/katex 에 저장
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir v && cd v && npm pack katex@0.16.11 >/dev/null && tar xzf katex-*.tgz && ls package/dist | head
      - run: |
          git config --global user.name bot; git config --global user.email bot@users.noreply.github.com
          git clone -q --branch data --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          rm -rf pub/vendor/katex && mkdir -p pub/vendor/katex
          cp v/package/dist/katex.min.js v/package/dist/katex.min.css v/package/LICENSE pub/vendor/katex/ && cp -r v/package/dist/fonts pub/vendor/katex/
          cd pub && git add -A && git commit -qm "vendor katex 0.16.11" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
