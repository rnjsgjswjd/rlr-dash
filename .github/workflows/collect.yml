name: collect-frequentzone
on:
  workflow_dispatch:
    inputs:
      years:
        description: "연도(띄어쓰기로 여러 개)"
        default: "2021 2022 2023 2024"
      types:
        description: "유형: lg(지자체별) freezing(결빙) oldman(보행노인) child(보행어린이)"
        default: "lg"
      extra:
        description: "추가 옵션 (예: --sido 42 45 --all-codes)"
        default: ""
      tag:
        description: "결과 파일 이름 꼬리표"
        default: "main"
      fetch_url:
        description: "(선택) 함께 내려받을 공개 통계 파일 URL"
        default: ""
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 법정동 코드표 준비
        run: |
          mkdir -p work && cp download/collect_frequentzone.py work/
          pip install -q PublicDataReader
          python - <<'PY'
          import PublicDataReader as pdr
          df = pdr.code_bdong()
          with open("work/법정동코드 전체자료.txt", "w", encoding="utf-8") as f:
              f.write("법정동코드\t법정동명\t폐지여부\n")
              for _, r in df.iterrows():
                  dead = str(r["말소일자"]).strip()
                  alive = "존재" if dead in ("", "nan", "None") else "폐지"
                  f.write(f"{r['법정동코드']}\t{r['시도명']} {r['시군구명']} {r['읍면동명']}\t{alive}\n")
          PY
      - name: 수집
        if: ${{ inputs.types != 'none' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          cd work
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "NO_SECRET" > status.txt; exit 0; fi
          python collect_frequentzone.py --years ${{ inputs.years }} --types ${{ inputs.types }} ${{ inputs.extra }} --out "fz_${{ inputs.tag }}.csv" > log.txt 2>&1 || true
          tr '\r' '\n' < log.txt | grep -v "누적" | tail -60 > status.txt
          tr '\r' '\n' < log.txt | grep "누적" | tail -3 >> status.txt
      - name: 공개 파일 내려받기
        if: ${{ inputs.fetch_url != '' }}
        run: |
          mkdir -p work/fetch
          curl -sSL -m 120 -A "Mozilla/5.0" -D work/fetch/headers.txt -o work/fetch/body.bin "${{ inputs.fetch_url }}" || echo "curl failed" > work/fetch/err.txt
          ls -la work/fetch > work/fetch/ls.txt; file work/fetch/body.bin >> work/fetch/ls.txt || true
      - name: 결과 저장 (data 브랜치에 누적)
        run: |
          git config --global user.name bot; git config --global user.email bot@users.noreply.github.com
          git clone -q --branch data --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub || (mkdir pub && cd pub && git init -q && git checkout -q -b data)
          T="${{ inputs.tag }}"
          cp work/status.txt "pub/status_$T.txt" 2>/dev/null || true
          cp work/fz_*.csv pub/ 2>/dev/null || true
          cp work/probe.json "pub/probe_$T.json" 2>/dev/null || true
          if [ -d work/fetch ]; then rm -rf "pub/fetch_$T"; cp -r work/fetch "pub/fetch_$T"; fi
          cd pub && git add -A && git commit -qm "collect $T" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
